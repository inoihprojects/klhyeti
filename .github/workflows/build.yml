# Builds klhyeti on GitHub's servers every time you push, so you don't need
# Flutter installed locally just to get a runnable app.
#
# Where to find the results:
#  - Any push: your repo -> "Actions" tab -> latest run -> "Artifacts".
#  - A version tag (e.g. v0.2.0): also published as a proper Release on the
#    repo's "Releases" page. See RELEASING.md.
#
# The android/, windows/, linux/ platform folders aren't committed (see
# SETUP.md), so every job generates them fresh with `flutter create` first.

name: Build

on:
  push:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

# Reverse-domain prefix for the app's package id (Android applicationId is
# $APP_ORG.klhyeti). Pick it once and keep it: changing it later makes
# Android treat the app as a different app, with separate data.
env:
  APP_ORG: io.github.inoihprojects

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,windows,linux --org "$APP_ORG" --project-name klhyeti .
          bash tool/post_create.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Three runs: in UTC a local day and a UTC day coincide, so date bugs
      # only show in a timezone far east (UTC+14) or far west (UTC-10).
      - run: flutter test
      - run: TZ=Pacific/Kiritimati flutter test
      - run: TZ=Pacific/Honolulu flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,windows,linux --org "$APP_ORG" --project-name klhyeti .
          bash tool/post_create.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # One APK per phone processor type instead of one APK containing all
      # three: each is roughly a third of the size. Almost every current
      # phone wants the arm64-v8a one.
      # --split-debug-info leaves the compiled Dart code's debugging symbols
      # out of the app (here and in the desktop builds below): a smaller
      # download, and nothing the app itself uses. Error messages are
      # unchanged; only a raw crash trace would read as addresses.
      - run: flutter build apk --release --split-per-abi --split-debug-info=build/debug-info
      - name: Sign APKs with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p dist
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Release builds must be signed with the release key. Add the signing secrets (see RELEASING.md)."
              exit 1
            fi
            echo "::warning::No signing key secrets set, so these APKs use a throwaway debug key and can't update an already-installed klhyeti. See RELEASING.md."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk")"; abi="${abi#app-}"; abi="${abi%-release.apk}"
            out="dist/klhyeti-$abi.apk"
            if [ -f "$RUNNER_TEMP/release.jks" ]; then
              "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
                --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
                --out "$out" "$apk"
            else
              cp "$apk" "$out"
            fi
          done
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs dist/klhyeti-arm64-v8a.apk | head -3
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: klhyeti-android
          path: dist/*.apk
      # Klhyeti talks to the local network when devices pair or sync, and to
      # nothing else. Android has one all-or-nothing permission for that,
      # INTERNET, so the APK must ask for it (tool/post_create.sh adds it)
      # and the app itself refuses addresses that aren't private ones
      # (lib/sync/lan_address.dart, checked by test/pairing_test.dart).
      # This step lists exactly what the APK asks Android for, and fails
      # if that ever includes anything about location, contacts, the
      # camera, the microphone, Bluetooth, the phone or text messages.
      - name: Check what the APK asks Android for
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          perms="$("$BT/aapt2" dump permissions dist/klhyeti-arm64-v8a.apk)"
          echo "$perms"
          {
            echo '### Android permissions requested by the APK'
            echo '```'
            echo "$perms"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! echo "$perms" | grep -q "android.permission.INTERNET"; then
            echo "::error::The APK does not request INTERNET, so pairing and direct sync cannot work. See tool/post_create.sh."
            exit 1
          fi
          unwanted='LOCATION|CONTACTS|CAMERA|RECORD_AUDIO|BLUETOOTH|PHONE|SMS|CALL_LOG|CALENDAR|BODY_SENSORS|NEARBY|ACCOUNTS'
          if echo "$perms" | grep '^uses-permission' | grep -E "$unwanted"; then
            echo "::error::The APK requests a permission Klhyeti has no use for (listed above)."
            exit 1
          fi

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,windows,linux --org "$APP_ORG" --project-name klhyeti .
          bash tool/post_create.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --split-debug-info=build/debug-info
      # The whole folder is the app: klhyeti.exe needs the .dll files and
      # the data/ folder next to it.
      - uses: actions/upload-artifact@v4
        with:
          name: klhyeti-windows
          path: build/windows/x64/runner/Release/

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,windows,linux --org "$APP_ORG" --project-name klhyeti .
          bash tool/post_create.sh
      - run: flutter pub get
      - run: flutter build linux --release --split-debug-info=build/debug-info
      # Packed as a tarball so the executable bit survives the download.
      - run: tar -czf klhyeti-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: klhyeti-linux
          path: klhyeti-linux-x64.tar.gz

  release:
    name: Publish release
    # Only for version tags like v0.2.0 — see RELEASING.md.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in pubspec.yaml
        run: |
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in pubspec.yaml ($version). Tag the commit as v$version instead."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/klhyeti-android/*.apk release/
          (cd artifacts/klhyeti-windows && zip -qr "$GITHUB_WORKSPACE/release/klhyeti-windows-x64.zip" .)
          cp artifacts/klhyeti-linux/klhyeti-linux-x64.tar.gz release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -lh release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # Versions below 1.0 are marked as pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
